{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 3rem auto;">
    <h1>Регистрация</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <div style="margin-bottom: 1rem;">
            <label>Логин</label>
            <input type="text" name="username" required>
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%">Зарегистрироваться</button>
    </form>
    <p style="margin-bottom: 1rem; text-align: center; color: #9ca3af;">
        Уже есть аккаунт? <a href="{{ url_for('login') }}" style="color: #f59e0b;">Войти</a>
    </p>
</div>
{% endblock %}
